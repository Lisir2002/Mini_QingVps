        <script src='https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js'></script>
        <script>
            var captchaTimer = setTimeout(() => { doRightNow() }, 500)
            var tokenTag = '5bb25648a831e469ea1e6aa2eacf47c6'
            function _getCaptcha() {
                $.ajax({
                    url: '/captcha/tp_captcha/index/refresh',
                    success: function (result) {
                        $('#captcha-img').prop('src', result.base64)
                        // captchaTag = result.captcha
                        tokenTag = result.token
                    }
                })
            }

            // 开始时触发的事件 给各个按钮绑定点击事件
            function doRightNow() {
                clearInterval(captchaTimer);
                document.getElementById("check-btn").onclick = function () { _check() };
                document.getElementById("cancel-btn").onclick = function () { _cancel() }
                document.getElementById("captcha-img").onclick = function () { _getCaptcha() }
            }

            // 前台验证码验证
            function _check() {
                // 获取输入框的值 与localStorage中进行比对
                const inputValue = $('#captcha-input').val().replace(/\s/g, '')
                // 调用验证验证码接口 进行后台验证
                $.ajax({
                    url: '/captcha/tp_captcha/index/verify',
                    method: 'post',
                    data: {
                        'captcha': inputValue,
                        'token': tokenTag
                    },
                    success: function (result) {
                        if (result.status === 200) {
                            document.getElementById('captcha-error-text').textContent = ''
                            $('#captcha-input').val('')
                            captchaCheckSuccsss(true, inputValue, tokenTag)
                        } else {
                            document.getElementById('captcha-error-text').textContent = result.msg
                            captchaCheckSuccsss(false)
                        }
                    },
                    error: function (error) {

                    }
                })
            }

            // 取消
            function _cancel() {
                document.getElementById('captcha-error-text').textContent = ''
                $('#captcha-input').val('')
                captchaCheckCancel()
            }

        </script>
